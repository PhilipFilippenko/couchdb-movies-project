<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Movies Offline</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    table { border-collapse: collapse; width: 100%; }
    td, th { border: 1px solid #ccc; padding: 4px; text-align: left; }
    input { width: 300px; }
    .box { border: 1px solid #999; padding: 10px; margin-bottom: 15px; }
    #log { font-family: monospace; font-size: 12px; white-space: pre; max-height: 150px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Movies</h1>
  <p>
    Status: <b id="status">starting</b>
    <button id="toggle">Go offline</button>
    <span id="count"></span>
  </p>

  <div class="box">
    <h3>Conflicts</h3>
    <div id="conflicts">none</div>
  </div>

  <div class="box">
    <h3 id="formTitle">Add movie</h3>
    <input type="hidden" id="id">
    <input type="hidden" id="rev">
    <p>Title: <input id="title"></p>
    <p>Actors: <input id="actors"> (comma separated)</p>
    <p>Genres: <input id="genres"> (comma separated)</p>
    <button id="save">Save</button>
    <button id="clear">Clear</button>
  </div>

  <div class="box">
    Search: <input id="search">
    <table>
      <tr><th>Title</th><th>Actors</th><th>Genres</th><th></th></tr>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="box">
    <h3>Log</h3>
    <div id="log"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pouchdb@9.0.0/dist/pouchdb.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
